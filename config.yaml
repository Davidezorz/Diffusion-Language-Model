mode: "DiT"   # AR | DiT
caching_directory:  '.data/'
checkpoint:         '.weights/DiT-independent-epoch=09-val_loss=1.7500.ckpt'
    # false 
    # '.weights/AR-epoch=07-val_loss=1.3041.ckpt'  # checkpoints/
    # '.weights/DiT-independent-epoch=09-val_loss=1.7500.ckpt'
inference_only:     False           # true | false

backbone:
    B: 2                            # ◀ batch dimension
    T: 768                          # ◀ context window AR (max sequence length)
    T_ctx: 768                      # ◀ context window   Diffusion 
    T_ans: 256                      # ◀ denoising window Diffusion 
    C: 768                          # ◀ embedding dimension
    N: 22                           # ◀ number of blocks
    H: 12                           # ◀ number of heads

training:
    max_epochs: 1
    limit_train_batches: 1.0        # 1.0 il modello vede l'intero dataset
    limit_val_batches: 1.0

    log_every_n_steps: 1

    debug_subset_size: 500
    validation_subset_size: 500

    validation_fraction: 0.05
    accumulate_grad_batches: 8
    seed: 42

    learning_rate: 0.00005
    warmup_steps: 200

diffusion:
    noise_schedule: "loglinear"
    
    corruption_type: "moving_sigmoid"      # independent | position | moving_sigmoid
    position_gamma: 0.2
    position_loss_weighting: false

    sigmoid_k: 15
    calibrated_sigmoid: true
    

